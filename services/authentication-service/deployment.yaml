apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-service
  namespace: shopper
  labels:
    app: authentication-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication-service
  template:
    metadata:
      labels:
        app: authentication-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: authentication-service
          image: authentication-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: authentication-service-config
          env:
            - name: AUTH_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: keycloak-secret, key: AUTH_SERVICE_CLIENT_SECRET }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 70
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 150m, memory: 320Mi }
            limits: { memory: 640Mi }
