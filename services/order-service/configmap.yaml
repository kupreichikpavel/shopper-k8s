apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: shopper
data:
  SERVER_PORT: "8083"
  DB_HOST: order-db
  DB_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_CONSUMER_GROUP: order-service
  PAYMENT_EVENTS_TOPIC: payment-events
  JWT_ISSUER_URI: http://keycloak:8080/realms/shopper
  JWT_JWK_SET_URI: http://keycloak:8080/realms/shopper/protocol/openid-connect/certs
  JWT_AUDIENCE: order-service
