apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shopper
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h order-db -p 5432; do sleep 2; done"]
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: order-service-config
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: order-db-secret, key: DB_NAME }
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: order-db-secret, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: order-db-secret, key: DB_PASSWORD }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 70
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
