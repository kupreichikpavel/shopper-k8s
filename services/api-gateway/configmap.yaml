apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: shopper
data:
  SERVER_PORT: "8080"
  JWT_ISSUER_URI: http://keycloak:8080/realms/shopper
  JWT_JWK_SET_URI: http://keycloak:8080/realms/shopper/protocol/openid-connect/certs
  AUTH_SERVICE_URL: http://authentication-service:8081
  USER_SERVICE_URL: http://user-service:8080
  ORDER_SERVICE_URL: http://order-service:8083
  PAYMENT_SERVICE_URL: http://payment-service:8080
