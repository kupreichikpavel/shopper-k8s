# Copy this file to config/secrets.yaml and replace the placeholders
# with real values before deploying.
# config/secrets.yaml is git-ignored and must never be committed.
apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  namespace: shopper
type: Opaque
stringData:
  DB_NAME: <order-service database name>
  DB_USERNAME: <order-service database user>
  DB_PASSWORD: <order-service database password>
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db-secret
  namespace: shopper
type: Opaque
stringData:
  DB_NAME: <payment-service MongoDB database name>
  DB_USERNAME: <payment-service MongoDB root user>
  DB_PASSWORD: <payment-service MongoDB root password>
---
apiVersion: v1
kind: Secret
metadata:
  name: user-db-secret
  namespace: shopper
type: Opaque
stringData:
  DB_NAME: <user-service database name>
  DB_USERNAME: <user-service database user>
  DB_PASSWORD: <user-service database password>
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: shopper
type: Opaque
stringData:
  DB_NAME: <Keycloak database name>
  DB_USERNAME: <Keycloak database user>
  DB_PASSWORD: <Keycloak database password>
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: shopper
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: <Keycloak admin console user>
  KC_BOOTSTRAP_ADMIN_PASSWORD: <Keycloak admin console password>
  # Must match the client secret in the Keycloak realm import
  AUTH_SERVICE_CLIENT_SECRET: <authentication-service client secret>
